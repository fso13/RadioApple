name: radio_mac
description: "RadioMac — интернет-радио для macOS в меню-баре"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  system_tray: ^2.0.3
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  window_manager: ^0.5.2
  package_info_plus: ^10.2.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  uuid: ^4.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/AppIcons/
