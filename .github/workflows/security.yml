name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv-scanner:
    name: OSV-Scanner
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    permissions:
      actions: read
      contents: read
      security-events: write

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  app-sbom:
    name: SBOM & CVE scan
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build (Release)
        run: |
          xcodebuild -project RadioMac.xcodeproj -scheme RadioMac \
            -configuration Release -derivedDataPath .build/DerivedData \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO build

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .build/DerivedData/Build/Products/Release/RadioMac.app
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: RadioMac-sbom.spdx.json
          upload-artifact: true

      - name: Scan SBOM with Grype
        id: grype
        uses: anchore/scan-action@v7
        continue-on-error: true
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: sarif
          output-file: grype.sarif

      - name: Upload SARIF
        if: always() && hashFiles('grype.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: grype.sarif

      - name: Fail on critical vulnerabilities
        if: steps.grype.outcome == 'failure'
        run: |
          echo "::error::Grype found critical vulnerabilities in the SBOM (see Security → Code scanning)."
          exit 1
