name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия без префикса v, например 1.0.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Unsupported version: $VERSION"
            exit 1
          fi
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved v$VERSION (prerelease=$PRERELEASE)"

      - name: Verify vendored binaries
        run: scripts/verify_third_party.sh

      - name: Build (Release, universal)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          xcodebuild -project RadioMac.xcodeproj -scheme RadioMac \
            -configuration Release -derivedDataPath .build/DerivedData \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      - name: Import signing certificate
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productsign \
            -T /usr/bin/pkgbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build DMG and PKG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ARGS=(--skip-build --version "$VERSION")
          if [[ -n "${DEVELOPER_ID_APPLICATION:-}" ]]; then
            ARGS+=(--identity "$DEVELOPER_ID_APPLICATION")
          fi
          if [[ -n "${DEVELOPER_ID_INSTALLER:-}" ]]; then
            ARGS+=(--installer-identity "$DEVELOPER_ID_INSTALLER")
          fi
          scripts/make_installer.sh "${ARGS[@]}"
          test -f "dist/RadioMac-${VERSION}.dmg"

      - name: Notarize and staple
        if: env.DEVELOPER_ID_APPLICATION != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          FILES=("dist/RadioMac-${VERSION}.dmg")
          if [[ -n "${DEVELOPER_ID_INSTALLER:-}" ]]; then
            FILES+=("dist/RadioMac-${VERSION}.pkg")
          fi
          for file in "${FILES[@]}"; do
            echo "Submitting $file"
            xcrun notarytool submit "$file" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait
            xcrun stapler staple "$file"
          done
          ( cd dist && shasum -a 256 \
              "RadioMac-${VERSION}.dmg" "RadioMac-${VERSION}.pkg" > SHA256SUMS.txt )

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .build/DerivedData/Build/Products/Release/RadioMac.app
          format: spdx-json
          output-file: dist/RadioMac-${{ steps.version.outputs.version }}.spdx.json
          artifact-name: RadioMac-sbom
          upload-artifact: false
          upload-release-assets: false

      - name: Prepare release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [[ -n "$PREV" ]]; then
            python3 scripts/release_notes.py --version "$VERSION" \
              --repo "$GITHUB_REPOSITORY" --previous-tag "$PREV" \
              --output release-notes.md
          else
            python3 scripts/release_notes.py --version "$VERSION" \
              --repo "$GITHUB_REPOSITORY" --output release-notes.md
          fi

          if [[ -n "${DEVELOPER_ID_APPLICATION:-}" ]]; then
            if [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_PASSWORD:-}" ]]; then
              printf '\nСборка подписана Developer ID и нотарифицирована.\n' >> release-notes.md
            else
              printf '\nСборка подписана Developer ID, без нотарификации.\n' >> release-notes.md
            fi
          else
            printf '\nСборка подписана ad-hoc: при первом запуске может потребоваться xattr -dr com.apple.quarantine /Applications/RadioMac.app.\n' >> release-notes.md
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ASSETS=(
            "dist/RadioMac-${VERSION}.dmg"
            "dist/RadioMac-${VERSION}.pkg"
            "dist/SHA256SUMS.txt"
            "dist/RadioMac-${VERSION}.spdx.json"
          )
          FLAGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            FLAGS+=(--prerelease)
          else
            FLAGS+=(--latest)
          fi
          TARGET=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              TAG_SHA="$(git rev-list -n 1 "$TAG")"
              if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
                echo "::warning::Tag $TAG points to $TAG_SHA, while this run builds $GITHUB_SHA."
              fi
            else
              TARGET=(--target "$GITHUB_SHA")
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            EDIT=(--title "RadioMac ${VERSION}")
            EDIT+=(${FLAGS[@]+"${FLAGS[@]}"})
            EDIT+=(--notes-file release-notes.md)
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" "${EDIT[@]}"
          else
            NOTES=(--notes-file release-notes.md)
            # Bash 3.2 (the default on macOS runners) treats "${EMPTY[@]}" as an
            # unbound variable under `set -u`; TARGET is empty on tag pushes.
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "RadioMac ${VERSION}" \
              ${TARGET[@]+"${TARGET[@]}"} \
              ${FLAGS[@]+"${FLAGS[@]}"} \
              ${NOTES[@]+"${NOTES[@]}"}
          fi

      - name: Update Homebrew tap
        if: success()
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == "true" ]]; then
            echo "Prerelease $VERSION: the Homebrew cask is updated only for stable releases."
            exit 0
          fi
          if [[ -z "${TAP_TOKEN:-}" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew tap update."
            exit 0
          fi
          CHECKSUMS="dist/SHA256SUMS.txt"
          if [[ ! -f "$CHECKSUMS" ]]; then
            curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/SHA256SUMS.txt" -o "$CHECKSUMS"
          fi
          SHA256="$(awk -v asset="RadioMac-${VERSION}.dmg" '$2 == asset { print $1 }' "$CHECKSUMS")"
          if [[ ! "$SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Cannot resolve SHA-256 for RadioMac-${VERSION}.dmg"
            exit 1
          fi
          scripts/update_homebrew_cask.sh "$VERSION" "$SHA256" "$TAP_TOKEN"

      - name: Summary
        if: success()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## RadioMac ${VERSION}"
            echo
            echo "- [Релиз](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
            echo "- [DMG](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/RadioMac-${VERSION}.dmg)"
            echo "- [PKG](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/RadioMac-${VERSION}.pkg)"
            echo "- [Homebrew](https://github.com/fso13/homebrew-tap): \`brew install --cask fso13/tap/radiomac\`"
            echo
            echo "\`\`\`"
            cat dist/SHA256SUMS.txt
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
